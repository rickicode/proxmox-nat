<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#gradient1)" opacity="0.1"/>
  
  <!-- Main Network Icon -->
  <g id="network">
    <!-- Central Hub -->
    <circle cx="32" cy="32" r="6" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
    
    <!-- Connection Lines -->
    <line x1="32" y1="32" x2="16" y2="16" stroke="url(#gradient2)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="48" y2="16" stroke="url(#gradient2)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="16" y2="48" stroke="url(#gradient2)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="48" y2="48" stroke="url(#gradient2)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Outer Nodes -->
    <circle cx="16" cy="16" r="4" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <circle cx="48" cy="16" r="4" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <circle cx="16" cy="48" r="4" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <circle cx="48" cy="48" r="4" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Flow Arrows -->
    <path d="M 38 28 L 42 32 L 38 36" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 26 28 L 22 32 L 26 36" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
